name: Comprobar compilación

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Compilar aplicación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar compilación
        run: npm run build
